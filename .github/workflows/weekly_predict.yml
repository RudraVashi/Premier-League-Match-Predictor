name: Weekly EPL Predictions

on:
  schedule:
    # Every Monday 06:00 UTC (ahead of a typical midweek/weekend PL slate)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cached models & data
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed
            models
            cache
          key: epl-data-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            epl-data-${{ hashFiles('requirements.txt') }}-
            epl-data-

      - name: Train if models missing
        run: |
          if [ ! -f models/xgboost.joblib ] && [ ! -f models/random_forest.joblib ]; then
            python run_pipeline.py --start-year 2015 --end-year 2025
          fi

      - name: Refresh data & score recent matches
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m src.predict --refresh-data --n-recent 30

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/latest_predictions.csv data/processed/latest_predictions.parquet cache/latest_explanations.json || true
          git add models/metrics.json || true
          if git diff --staged --quiet; then
            echo "No prediction changes to commit"
          else
            git commit -m "chore: weekly EPL prediction refresh $(date -u +%Y-%m-%d)"
            git push
          fi
